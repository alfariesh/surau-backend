services:
  # The whole suite registers users from one container IP, so the per-IP
  # register/login budgets must exceed the total auth flows across all tests.
  app:
    environment:
      AUTH_RATE_LIMIT_REGISTER_IP_MAX: "100"
      AUTH_RATE_LIMIT_LOGIN_IP_MAX: "100"
      BACKGROUND_LOOPS_ENABLED: "false"
      # The deterministic rollout guard requires the static false value, while
      # this regular-file activation marker keeps integration-only dispatch
      # loops (notably the email dead-letter test) running.
      BACKGROUND_LOOPS_ACTIVATION_FILE: "/app"
      RAG_LLM_DRIVER: "deterministic-rollout"
      INFERENCE_CACHE_ENCRYPTION_KEY: "integration-u0-cache-key-at-least-thirty-two-bytes"

  integration-test:
    container_name: integration-test
    platform: linux/amd64
    pid: "host"
    build:
      context: .
      dockerfile: integration-test/Dockerfile
    environment:
      RUN_INTEGRATION_TESTS: "1"
      INTEGRATION_HTTP_URL: "http://app:8080"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - test.lvh.me


networks:
  app_network:
    external: false
