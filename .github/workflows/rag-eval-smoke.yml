name: RAG Eval W3

# U-6 W3 scheduled observation. It never runs on pull_request, so it cannot
# block a merge. A red run is still intentional: Telegram turns deterministic
# regressions, first-attempt flakes, and missing advisory judge coverage into
# an operator alarm.
on:
  schedule:
    # Sunday 19:00 UTC = Monday 02:00 WIB, weekly.
    - cron: "0 19 * * 0"
  workflow_dispatch: {}

jobs:
  evaluate-dev:
    name: runner / rag-eval / U-6 scheduled dev
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
      SURAU_LIVE_PG: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
      RAG_EVAL_BASE_URL: https://dev-api.surau.org
      RAG_EVAL_SERVICE_TOKEN: ${{ secrets.RAG_EVAL_SERVICE_TOKEN }}
      RAG_EVAL_JUDGE_TOKEN: ${{ secrets.RAG_EVAL_SERVICE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - name: Apply migrations for the construction gate
        run: migrate -path migrations -database "$PG_URL" up
      - name: Pin report identity to the deployed dev version
        run: |
          set -euo pipefail
          version="$(curl -fsS https://dev-api.surau.org/version | jq -r '.version')"
          [[ "$version" =~ ^dev-[0-9a-f]{7}$ ]]
          echo "RAG_EVAL_COMMIT_SHA=${version#dev-}" >> "$GITHUB_ENV"
      - name: Run named deterministic construction cases
        run: |
          set -euo pipefail
          case_pattern='^(TestUseCaseRejectsContentInjectionAndRepairsFromEvidence|'
          case_pattern+='TestUseCaseRejectsContentInjectionWhenRepairRepeatsAttack|'
          case_pattern+='TestEvaluateCaseFailsInvalidCitationLocator|TestEvaluateCaseFailsMissingQuote|'
          case_pattern+='TestLiveQuranCitableUnitsNeverInterpretiveEligible)$'
          go test -p 1 -count=1 -json \
            -run "$case_pattern" \
            ./internal/rageval ./internal/usecase/bookrag ./internal/repo/persistent \
            | tee u6-go-test.jsonl
      - name: Run W3 HTTP profile with one observable scheduled retry
        id: http
        run: |
          set +e
          go run ./cmd/rag-eval run \
            -catalog eval/u6/catalog.json \
            -profile scheduled \
            -cases eval/u6/w3_http.jsonl \
            -retries 1 \
            -output json \
            -verbose > u6-http-report.json 2> >(tee u6-http-progress.log >&2)
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Merge category report and enforce deterministic policy
        id: gate
        run: |
          set +e
          go run ./cmd/rag-eval report \
            -catalog eval/u6/catalog.json \
            -profile scheduled \
            -http-report u6-http-report.json \
            -go-test-json u6-go-test.jsonl \
            -output json > u6-report.json
          report_status=$?
          if [ "$report_status" -eq 0 ]; then
            go run ./cmd/rag-eval report \
              -catalog eval/u6/catalog.json \
              -profile scheduled \
              -http-report u6-http-report.json \
              -go-test-json u6-go-test.jsonl \
              -output markdown > u6-report.md
            go run ./cmd/rag-eval gate \
              -catalog eval/u6/catalog.json \
              -report u6-report.json > u6-gate.json
            gate_status=$?
          else
            gate_status=1
          fi
          echo "report_status=$report_status" >> "$GITHUB_OUTPUT"
          echo "gate_status=$gate_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish pass-rate dashboard
        if: always()
        run: |
          if [ -f u6-report.md ]; then
            cat u6-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## U-6 evaluation"
              echo ""
              echo "Report could not be built; inspect the uploaded raw artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload W3 report and human-review packet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u6-scheduled-eval
          path: |
            u6-go-test.jsonl
            u6-http-report.json
            u6-http-progress.log
            u6-report.json
            u6-report.md
            u6-gate.json
      - name: Raise scheduled alarms
        if: always()
        env:
          HTTP_STATUS: ${{ steps.http.outputs.status }}
          REPORT_STATUS: ${{ steps.gate.outputs.report_status }}
          GATE_STATUS: ${{ steps.gate.outputs.gate_status }}
        run: |
          set -euo pipefail
          alarm=0
          if [ "${HTTP_STATUS:-1}" -ne 0 ] ||
             [ "${REPORT_STATUS:-1}" -ne 0 ] ||
             [ "${GATE_STATUS:-1}" -ne 0 ]; then
            echo "::error::U-6 deterministic scheduled evaluation failed"
            alarm=1
          fi
          if [ -f u6-report.json ] &&
             jq -e '.results[] | select(.first_attempt_failed == true)' u6-report.json >/dev/null; then
            echo "::error::At least one case failed its first attempt; retry did not erase the alarm"
            alarm=1
          fi
          if [ -f u6-report.json ] &&
             jq -e '.results[] | select(.judge.status != null and .judge.status != "completed")' \
               u6-report.json >/dev/null; then
            echo "::error::Advisory judge was skipped or failed"
            alarm=1
          fi
          exit "$alarm"
      - name: Telegram alarm — U-6 scheduled eval failed
        if: failure()
        uses: ./.github/actions/telegram-notify
        with:
          message: >-
            ❌ U-6 W3 eval di dev-api memerlukan perhatian. Periksa pass-rate
            per kategori, percobaan pertama, dan status judge:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
