name: Inference DEV provider preflight

on:
  workflow_dispatch:

jobs:
  provider-readiness:
    name: runner / inference / dev provider readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    env:
      VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
      VPS_USER: ${{ secrets.DEV_VPS_USER }}
      VPS_DEPLOY_PATH: ${{ secrets.DEV_VPS_DEPLOY_PATH }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.DEV_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Verify active provider credentials and primary price
        shell: bash
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Set the DEV_VPS_HOST repository secret}"
          : "${VPS_USER:?Set the DEV_VPS_USER repository secret}"
          : "${VPS_DEPLOY_PATH:?Set the DEV_VPS_DEPLOY_PATH repository secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Set the DEV_VPS_SSH_PRIVATE_KEY repository secret}"
          : "${VPS_SSH_KNOWN_HOSTS:?Set the pinned DEV_VPS_SSH_KNOWN_HOSTS secret}"
          umask 077

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/surau_deploy_key
          chmod 600 ~/.ssh/surau_deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/surau_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=30 \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH='$VPS_DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -r .env.production

          require_nonempty_env() {
            key="$1"
            minimum_length="$2"
            if ! awk -v key="$key" -v minimum="$minimum_length" '
              index($0, key "=") == 1 {
                value = substr($0, length(key) + 2)
                present = length(value) >= minimum
              }
              END { exit present ? 0 : 1 }
            ' .env.production; then
              echo "U-0 preflight failed: $key is missing or too short" >&2
              exit 1
            fi
          }

          require_nonempty_env RAG_LLM_API_KEY 8

          secondary_enabled="$(awk -F= '
            $1 == "INFERENCE_SECONDARY_ENABLED" {
              print substr($0, index($0, "=") + 1)
            }
          ' .env.production | tail -1)"
          secondary_enabled="${secondary_enabled:-true}"
          case "$secondary_enabled" in
            true) require_nonempty_env DEEPSEEK_API_KEY 8 ;;
            false) ;;
            *)
              echo "U-0 preflight failed: INFERENCE_SECONDARY_ENABLED must be true or false" >&2
              exit 1
              ;;
          esac

          model="$(awk -F= '
            $1 == "RAG_LLM_MODEL" {
              print substr($0, index($0, "=") + 1)
            }
          ' .env.production | tail -1)"
          model="${model:-glm-5.1}"
          base_url="$(awk -F= '
            $1 == "RAG_LLM_BASE_URL" {
              print substr($0, index($0, "=") + 1)
            }
          ' .env.production | tail -1)"
          base_url="${base_url:-https://ai.sumopod.com/v1}"

          price_version="$(awk -F= '
            $1 == "INFERENCE_SUMOPOD_PRICE_VERSION" {
              print substr($0, index($0, "=") + 1)
            }
          ' .env.production | tail -1)"
          input_price="$(awk -F= '
            $1 == "INFERENCE_SUMOPOD_INPUT_USD_PER_MILLION" {
              print substr($0, index($0, "=") + 1)
            }
          ' .env.production | tail -1)"
          cached_price="$(awk -F= '
            $1 == "INFERENCE_SUMOPOD_CACHED_INPUT_USD_PER_MILLION" {
              print substr($0, index($0, "=") + 1)
            }
          ' .env.production | tail -1)"
          output_price="$(awk -F= '
            $1 == "INFERENCE_SUMOPOD_OUTPUT_USD_PER_MILLION" {
              print substr($0, index($0, "=") + 1)
            }
          ' .env.production | tail -1)"

          override_count=0
          for value in "$price_version" "$input_price" "$cached_price" "$output_price"; do
            if [ -n "$value" ]; then
              override_count=$((override_count + 1))
            fi
          done

          if [ "$override_count" -gt 0 ] && [ "$override_count" -lt 4 ]; then
            echo "U-0 preflight failed: SumoPod price override tuple is incomplete" >&2
            exit 1
          fi

          if [ "$override_count" -eq 4 ]; then
            for price in "$input_price" "$cached_price" "$output_price"; do
              if ! printf '%s\n' "$price" | grep -Eq '^[0-9]+([.][0-9]+)?$'; then
                echo "U-0 preflight failed: operator price must be a nonnegative decimal" >&2
                exit 1
              fi
            done

            api_key="$(awk -F= '
              $1 == "RAG_LLM_API_KEY" {
                print substr($0, index($0, "=") + 1)
              }
            ' .env.production | tail -1)"
            model_file="$(mktemp)"
            chmod 600 "$model_file"
            curl -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $api_key" \
              "${base_url%/}/models" >"$model_file"
            unset api_key
            python3 - "$model_file" "$model" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          models = payload.get("data", []) if isinstance(payload, dict) else payload
          if not any(
              isinstance(row, dict) and row.get("id") == sys.argv[2]
              for row in models
          ):
              raise SystemExit("U-0 preflight failed: configured model is absent from provider")
          PY
            rm -f "$model_file"
            price_source="operator:$price_version"
          else
            catalog_url="$(awk -F= '
              $1 == "INFERENCE_SUMOPOD_CATALOG_URL" {
                print substr($0, index($0, "=") + 1)
              }
            ' .env.production | tail -1)"
            catalog_url="${catalog_url:-https://api-gate.sumopod.com/webhook/sumopod/ai/models}"
            curl -fsS --connect-timeout 10 --max-time 30 "$catalog_url" |
              grep -F "\"model_name\":\"$model\"" >/dev/null
            price_source="catalog"
          fi

          echo "U-0 provider preflight: primary model $model reachable; price=$price_source; secondary=$secondary_enabled"
          REMOTE
